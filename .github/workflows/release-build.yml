# Builds Slayer.zip (the Windows game: Slayer.exe and its folder) the same way build/build_exe.bat does.
#
# - When a release is published on GitHub (tag like v0.1 or v0.1.2), Slayer.zip is attached to it a few
#   minutes later. A Slayer.zip already on that release is replaced.
# - It can also be run by hand from the Actions tab ("Run workflow"); the zip is then a downloadable
#   artifact on the run's page, without making a release.
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to attach Slayer.zip to the release
    steps:
      # Third-party steps are pinned to an exact commit (not a tag that could be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the release tag looks like a version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Release tag '$TAG' must look like v0.1 or v0.1.2"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3" # what Ted plays it with

      - name: Install the game's packages and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Check the CSVs
        run: python tools/check_data.py

      - name: Build Slayer.exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/temp build/Slayer.spec

      - name: Check the build is all there
        shell: bash
        run: |
          test -s dist/Slayer/Slayer.exe
          test -d dist/Slayer/_internal/supporting_docs
          test -s dist/Slayer/_internal/assets/icon.png

      - name: Zip it up
        run: |
          Copy-Item LICENSE.md dist/Slayer/
          Copy-Item -Recurse LICENSES dist/Slayer/
          Compress-Archive -Path dist/Slayer -DestinationPath dist/Slayer.zip -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Slayer
          path: dist/Slayer.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/Slayer.zip --clobber
